  把这个文件整个替换成你自己的 SVG 即可，AppShell 会自动用新的。
  推荐 viewBox="0 0 24 24"，width/height 矢量自适应所有 DPI。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
